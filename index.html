<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist BG</title>
<meta name="theme-color" content="#1F273F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist BG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: uma coluna para celular; moldura azul-marinho da marca, itens com cores de semáforo */
:root{
  --marca:#1F273F; --marca-verde:#3DD84B; --marca-amarelo:#FCE61A;
  --bg:#F3F5F9; --card:#FFFFFF; --fg:#1A2133; --muted:#5B6478; --linha:#D9DEE8;
  --ok:#1E8E3E; --ok-bg:#E3F4E8; --nc:#C62828; --nc-bg:#FDE7E7; --aviso:#8A6D00; --aviso-bg:#FFF6CC;
  --campo:#FFFFFF; --foco:#2F6FEB;
  --f-corpo:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-titulo:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1422; --card:#1A2234; --fg:#E8ECF4; --muted:#A3ACC0; --linha:#2E3850;
  --ok:#5BD07A; --ok-bg:#16301F; --nc:#FF7A7A; --nc-bg:#3A1A1C; --aviso:#F5D85A; --aviso-bg:#3A3215;
  --campo:#121929; --foco:#7AA7FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1422; --card:#1A2234; --fg:#E8ECF4; --muted:#A3ACC0; --linha:#2E3850;
  --ok:#5BD07A; --ok-bg:#16301F; --nc:#FF7A7A; --nc-bg:#3A1A1C; --aviso:#F5D85A; --aviso-bg:#3A3215;
  --campo:#121929; --foco:#7AA7FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-corpo);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--marca)}
header.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--marca);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{height:30px;width:auto}
.wordmark{font-family:var(--f-titulo);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.wordmark b{color:var(--marca-verde)} .wordmark i{font-style:normal;color:var(--marca-amarelo)}
.fila-chip{margin-left:auto;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.fila-chip.tem{background:var(--marca-amarelo);color:#1F273F}
.faixa{background:var(--marca);color:#C9D1E3;font-size:13px;padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-titulo);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:21px}
.sub{color:var(--muted);font-size:15px;margin:0}
.bloco{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
label.rot{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
select,input[type=text],input[type=password],input[type=datetime-local],input[inputmode=numeric],textarea{
  width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--campo);color:var(--fg);min-height:50px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.info{font-size:15px;color:var(--muted)}
.info strong{color:var(--fg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:18px;min-height:54px}
.btn-pri{background:#15803D;color:#FFFFFF;width:100%;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-pri:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{background:#1F273F;color:#FFFFFF;border:1.5px solid #5B6B95}
.lista-check{display:flex;flex-direction:column;gap:10px}
.cartao-check{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--linha);border-radius:12px;padding:14px 16px;color:var(--fg)}
.cartao-check .nome{font-family:var(--f-titulo);font-size:21px;font-weight:700}
.cartao-check .det{color:var(--muted);font-size:14px}
.cartao-check .seta{margin-left:auto;font-size:24px;color:var(--muted)}
.item{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--linha)}
.item.ok{border-left-color:var(--ok)} .item.nc{border-left-color:var(--nc)}
.item-topo{display:flex;align-items:baseline;gap:8px}
.item-num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:26px}
.item-nome{font-weight:600}
.linha-resp{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:stretch}
.qtd input{text-align:center;font-variant-numeric:tabular-nums}
.sit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sit button{border:1.5px solid var(--linha);background:var(--campo);color:var(--fg);border-radius:10px;font-weight:600;font-size:16px;min-height:50px;padding:6px}
.sit button.ok[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sit button.nc[aria-pressed=true]{background:var(--nc-bg);border-color:var(--nc);color:var(--nc)}
.desc label{color:var(--nc);font-weight:600;font-size:14px}
.foto-caixa{border:2px dashed var(--linha);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.foto-caixa img{border-radius:8px;max-height:260px;object-fit:cover}
.foto-caixa input{display:none}
.aviso{background:var(--aviso-bg);color:var(--aviso);border-radius:10px;padding:12px 14px;font-size:15px}
.alerta-nav{background:#FCE61A;color:#1F273F;font-weight:600;font-size:14px;line-height:1.35;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid #1F273F}
.erro{background:var(--nc-bg);color:var(--nc);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500}
.sucesso{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:14px;font-weight:600}
.decl{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.decl input{width:24px;height:24px;margin-top:2px;flex:none}
.barra-acao{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);z-index:4;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra-acao .dentro{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.progresso{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fila-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linha);padding-block:8px;font-size:15px}
.fila-item:last-child{border-bottom:0}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.esp{background:var(--aviso-bg);color:var(--aviso)} .tag.env{background:var(--ok-bg);color:var(--ok)}
.demo{border:1.5px solid var(--aviso);color:var(--aviso);background:var(--aviso-bg);border-radius:10px;padding:10px 12px;font-size:14px}
.voltar{background:none;border:0;color:var(--muted);font-size:15px;padding:4px 0;align-self:flex-start}
.marca img{height:34px}
.falta{color:var(--nc);font-weight:600;font-size:14px;margin:0}
.item.erro-item{border-color:var(--nc);box-shadow:0 0 0 2px var(--nc-bg)}
.erro ul{margin:6px 0 0;padding-left:20px}
.data-fixa{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.data-fixa strong{font-size:20px;font-variant-numeric:tabular-nums}
.camera{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.camera video{width:100%;max-height:340px;border-radius:10px;background:#000;object-fit:cover}
/* Moldura da marca: laterais descem em azul-marinho e viram verde; base verde */
.moldura{position:fixed;top:0;bottom:0;width:calc(7px + var(--lado,0px));z-index:6;pointer-events:none;
  background:linear-gradient(to bottom,var(--marca) 0%,var(--marca) 40%,#1E7A4A 72%,var(--marca-verde) 100%)}
.moldura.esq{left:0;--lado:env(safe-area-inset-left,0px)} .moldura.dir{right:0;--lado:env(safe-area-inset-right,0px)}
.moldura-base{position:fixed;left:0;right:0;bottom:0;height:calc(8px + env(safe-area-inset-bottom,0px));background:var(--marca-verde);z-index:6;pointer-events:none}
main{padding-left:max(20px,calc(env(safe-area-inset-left,0px) + 14px));padding-right:max(20px,calc(env(safe-area-inset-right,0px) + 14px))}
.barra-acao{bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-bottom:10px;padding-left:max(20px,calc(env(safe-area-inset-left,0px) + 14px));padding-right:max(20px,calc(env(safe-area-inset-right,0px) + 14px))}
/* Aberto no navegador (antes de instalar): sem a base verde, para o Safari/Chrome não pintar a barra dele de verde */
@media (display-mode: browser){
  .moldura-base{display:none}
  .moldura{background:var(--marca)}
  .barra-acao{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.item,.cartao-check{transition:border-color .15s}}

.sit.tres{grid-template-columns:1fr 1fr 1fr}
.sit button.na[aria-pressed=true]{background:var(--aviso-bg);border-color:var(--aviso);color:var(--aviso)}
.item.na{border-left-color:var(--aviso)}
.bloco-titulo{font-size:19px;margin-top:8px;color:var(--fg);padding-bottom:4px;border-bottom:2px solid var(--marca-verde);align-self:flex-start}
.cartao-check.feito{border-color:var(--ok);background:var(--ok-bg);opacity:.85}
.cartao-check.feito .seta{color:var(--ok)}
.foto-nc{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.foto-nc .camera img{max-height:200px;border-radius:8px}
@media (max-width:420px){.sit.tres button{font-size:14px}.linha-resp{grid-template-columns:84px 1fr}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
